<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Flow | Dashboard + Board + Git Solution</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', sans-serif;
            background: #eef2f9;
            padding: 20px;
            transition: all 0.3s;
        }
        /* English mode */
        body.english { direction: ltr; text-align: left; }
        body.arabic { direction: rtl; text-align: right; }

        .container { max-width: 1400px; margin: auto; }
        
        /* Top Bar */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: white; padding: 10px 25px; border-radius: 60px;
            margin-bottom: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            flex-wrap: wrap;
        }
        .logo h1 { font-size: 1.6rem; color: #1f6392; }
        .lang-buttons button, .git-button {
            background: #eef2f9; border: none; padding: 8px 18px;
            border-radius: 30px; cursor: pointer; font-weight: 600;
            margin: 0 5px; font-family: inherit;
        }
        .lang-buttons button.active { background: #1f6392; color: white; }
        .git-button { background: #2c5a2e; color: white; }
        .git-button i { margin-left: 8px; }

        /* Tabs */
        .tabs {
            display: flex; gap: 15px; margin-bottom: 25px;
            border-bottom: 2px solid #cbdde9; padding-bottom: 5px;
        }
        .tab-btn {
            background: none; border: none; padding: 10px 20px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            border-radius: 30px; transition: 0.2s;
        }
        .tab-btn.active { background: #1f6392; color: white; }

        /* Panels */
        .panel { display: none; animation: fade 0.3s ease; }
        .panel.active-panel { display: block; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        /* Dashboard Stats */
        .stats {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(230px,1fr));
            gap: 20px; margin-bottom: 30px;
        }
        .stat-card {
            background: white; padding: 20px; border-radius: 28px;
            text-align: center; box-shadow: 0 5px 10px rgba(0,0,0,0.03);
        }
        .stat-number { font-size: 2.5rem; font-weight: 800; color: #1f6392; }
        .recent-list {
            background: white; border-radius: 28px; padding: 20px;
        }
        .recent-item {
            padding: 12px 0; border-bottom: 1px solid #eef2f6;
            display: flex; justify-content: space-between;
        }

        /* Board (Kanban) */
        .add-task {
            background: white; border-radius: 60px; padding: 5px 5px 5px 20px;
            display: flex; gap: 10px; margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .add-task input { flex: 1; border: none; padding: 14px; font-size: 1rem; outline: none; }
        .add-task button { background: #1f6392; color: white; border: none; padding: 10px 25px; border-radius: 50px; cursor: pointer; font-weight: bold; }
        .kanban {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
            gap: 20px;
        }
        .column {
            background: rgba(255,255,255,0.7); backdrop-filter: blur(4px);
            border-radius: 28px; padding: 15px;
        }
        .column-header {
            display: flex; justify-content: space-between; margin-bottom: 15px;
            font-weight: 700; font-size: 1.2rem;
        }
        .task-list {
            min-height: 400px; max-height: 55vh; overflow-y: auto;
            display: flex; flex-direction: column; gap: 10px;
        }
        .task-card {
            background: white; padding: 12px; border-radius: 20px;
            border-right: 5px solid; cursor: grab;
            transition: 0.1s;
        }
        .task-card.todo { border-right-color: #f4a261; }
        .task-card.in-progress { border-right-color: #2a9d8f; }
        .task-card.done { border-right-color: #48cae4; }
        .task-text { font-weight: 600; word-break: break-word; }
        .task-meta { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.7rem; color: #7795a8; }
        .task-actions button { background: none; border: none; cursor: pointer; margin: 0 5px; }
        .delete-btn:hover { color: #e76f51; }

        /* Git Console */
        .git-console {
            margin-top: 35px; background: #1e2a32; border-radius: 24px;
            padding: 20px; color: #b0e0a0; font-family: monospace;
            direction: ltr; text-align: left;
        }
        .git-console pre { white-space: pre-wrap; word-break: break-word; }
        .git-header { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; color: #9bcd6c; }
    </style>
</head>
<body class="arabic">
<div class="container">
    <!-- Top Bar -->
    <div class="top-bar">
        <div class="logo"><h1><i class="fas fa-tasks"></i> Task Flow</h1></div>
        <div class="lang-buttons">
            <button id="arabicBtn" class="active">🇸🇦 العربية</button>
            <button id="englishBtn">🇬🇧 English</button>
            <button id="gitActionBtn" class="git-button"><i class="fab fa-git-alt"></i> <span id="gitBtnText">حل مشكلة git add .</span></button>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="dashboard"><i class="fas fa-chart-line"></i> <span class="tabTxt">Dashboard</span></button>
        <button class="tab-btn" data-tab="board"><i class="fas fa-columns"></i> <span class="tabTxt">Board</span></button>
    </div>

    <!-- Dashboard Panel -->
    <div id="dashboardPanel" class="panel active-panel">
        <div class="stats">
            <div class="stat-card"><div class="stat-number" id="totalTasks">0</div><div id="totalLabel">إجمالي المهام</div></div>
            <div class="stat-card"><div class="stat-number" id="todoStat">0</div><div id="todoLabel">معلقة</div></div>
            <div class="stat-card"><div class="stat-number" id="progressStat">0</div><div id="progressLabel">قيد التنفيذ</div></div>
            <div class="stat-card"><div class="stat-number" id="doneStat">0</div><div id="doneLabel">منجزة</div></div>
        </div>
        <div class="recent-list"><h3><i class="fas fa-clock"></i> <span id="recentTitle">آخر المهام</span></h3><div id="recentTasks"></div></div>
    </div>

    <!-- Board Panel -->
    <div id="boardPanel" class="panel">
        <div class="add-task">
            <input type="text" id="taskInput" placeholder="أضف مهمة جديدة...">
            <button id="addTaskBtn"><i class="fas fa-plus"></i> <span id="addBtnText">إضافة</span></button>
        </div>
        <div class="kanban">
            <div class="column" data-status="todo"><div class="column-header"><span>📋 <span id="todoColTitle">معلق</span></span><span class="badge" id="todoCount">0</span></div><div class="task-list" id="todoList"></div></div>
            <div class="column" data-status="in-progress"><div class="column-header"><span>⚙️ <span id="progressColTitle">قيد التنفيذ</span></span><span class="badge" id="progressCount">0</span></div><div class="task-list" id="progressList"></div></div>
            <div class="column" data-status="done"><div class="column-header"><span>✅ <span id="doneColTitle">مكتمل</span></span><span class="badge" id="doneCount">0</span></div><div class="task-list" id="doneList"></div></div>
        </div>
    </div>

    <!-- Git Console - حل المشكلة -->
    <div class="git-console">
        <div class="git-header"><i class="fab fa-git-alt"></i> <span id="gitConsoleTitle">Git Terminal | حل مشكلة add . و push</span></div>
        <pre id="gitOutput">▶️ جاهز. اضغط على زر "حل مشكلة git add ." لمحاكاة الرفع إلى GitHub</pre>
    </div>
</div>

<script>
    // ---------- البيانات ----------
    let tasks = [
        { id: '1', text: '🎨 تصميم واجهة Task Flow', status: 'todo' },
        { id: '2', text: '🐙 حل مشكلة git add . و الرفع', status: 'in-progress' },
        { id: '3', text: '📊 عمل Dashboard منفصل', status: 'done' }
    ];
    let currentLang = 'ar';

    function saveTasks() { localStorage.setItem('taskflow_data', JSON.stringify(tasks)); }
    function loadTasks() { let data = localStorage.getItem('taskflow_data'); if(data) tasks = JSON.parse(data); else saveTasks(); }
    loadTasks();

    function generateId() { return Date.now() + '-' + Math.random().toString(36).substr(2, 6); }

    // تحديث كل الواجهات
    function refreshAll() {
        refreshDashboard();
        refreshBoard();
    }

    function refreshDashboard() {
        document.getElementById('totalTasks').innerText = tasks.length;
        document.getElementById('todoStat').innerText = tasks.filter(t=>t.status==='todo').length;
        document.getElementById('progressStat').innerText = tasks.filter(t=>t.status==='in-progress').length;
        document.getElementById('doneStat').innerText = tasks.filter(t=>t.status==='done').length;
        let recent = [...tasks].reverse().slice(0,5);
        let container = document.getElementById('recentTasks');
        if(recent.length===0) container.innerHTML = '<div class="recent-item">لا توجد مهام</div>';
        else container.innerHTML = recent.map(t=>`<div class="recent-item"><span>${t.text}</span><small>${getStatusName(t.status)}</small></div>`).join('');
    }

    function getStatusName(status) {
        if(currentLang === 'ar') return status==='todo'?'معلق':status==='in-progress'?'قيد التنفيذ':'مكتمل';
        return status==='todo'?'Todo':status==='in-progress'?'In Progress':'Done';
    }

    function refreshBoard() {
        let todoList = tasks.filter(t=>t.status==='todo');
        let progressList = tasks.filter(t=>t.status==='in-progress');
        let doneList = tasks.filter(t=>t.status==='done');
        document.getElementById('todoCount').innerText = todoList.length;
        document.getElementById('progressCount').innerText = progressList.length;
        document.getElementById('doneCount').innerText = doneList.length;
        document.getElementById('todoList').innerHTML = renderTasks(todoList, 'todo');
        document.getElementById('progressList').innerHTML = renderTasks(progressList, 'in-progress');
        document.getElementById('doneList').innerHTML = renderTasks(doneList, 'done');
        attachEvents();
        attachDragDrop();
    }

    function renderTasks(taskArray, type) {
        if(taskArray.length===0) return `<div class="task-card" style="background:#f8fafc;text-align:center;cursor:default;">📭 ${currentLang==='ar'?'لا توجد مهام':'No tasks'}</div>`;
        return taskArray.map(task=>`
            <div class="task-card ${task.status}" draggable="true" data-id="${task.id}" data-status="${task.status}">
                <div class="task-text">${escapeHtml(task.text)}</div>
                <div class="task-meta">
                    <span><i class="far fa-clock"></i> ${new Date(parseInt(task.id.split('-')[0])||Date.now()).toLocaleTimeString()}</span>
                    <div class="task-actions">
                        <button class="move-left" data-id="${task.id}" data-status="${task.status}"><i class="fas fa-arrow-left"></i></button>
                        <button class="move-right" data-id="${task.id}" data-status="${task.status}"><i class="fas fa-arrow-right"></i></button>
                        <button class="delete-btn" data-id="${task.id}"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    function attachEvents() {
        document.querySelectorAll('.delete-btn').forEach(btn=>btn.onclick=(e)=>{ let id=btn.dataset.id; tasks=tasks.filter(t=>t.id!==id); saveTasks(); refreshAll(); addGitLog(`🗑️ حذف مهمة ID: ${id}`); });
        document.querySelectorAll('.move-left').forEach(btn=>btn.onclick=(e)=>{ let id=btn.dataset.id, st=btn.dataset.status; let newSt=null; if(st==='in-progress') newSt='todo'; else if(st==='done') newSt='in-progress'; if(newSt){ let task=tasks.find(t=>t.id===id); if(task) task.status=newSt; saveTasks(); refreshAll(); addGitLog(`⬅️ نقل مهمة إلى ${newSt}`); } });
        document.querySelectorAll('.move-right').forEach(btn=>btn.onclick=(e)=>{ let id=btn.dataset.id, st=btn.dataset.status; let newSt=null; if(st==='todo') newSt='in-progress'; else if(st==='in-progress') newSt='done'; if(newSt){ let task=tasks.find(t=>t.id===id); if(task) task.status=newSt; saveTasks(); refreshAll(); addGitLog(`➡️ نقل مهمة إلى ${newSt}`); } });
    }

    // Drag & Drop
    let dragId=null;
    function attachDragDrop(){
        document.querySelectorAll('.task-card[draggable="true"]').forEach(card=>{
            card.ondragstart = e=>{ dragId=card.dataset.id; e.dataTransfer.effectAllowed='move'; };
            card.ondragend = ()=> dragId=null;
        });
        document.querySelectorAll('.task-list').forEach(list=>{
            list.ondragover = e=> e.preventDefault();
            list.ondrop = e=>{
                e.preventDefault();
                let targetCol = list.closest('.column')?.dataset.status;
                if(dragId && targetCol){
                    let task = tasks.find(t=>t.id===dragId);
                    if(task && task.status !== targetCol){ task.status=targetCol; saveTasks(); refreshAll(); addGitLog(`🖱️ سحب وإفلات: ${task.text} -> ${targetCol}`); }
                }
                dragId=null;
            };
        });
    }

    // إضافة مهمة
    document.getElementById('addTaskBtn').onclick = ()=>{
        let input = document.getElementById('taskInput');
        let text = input.value.trim();
        if(text===''){ addGitLog('⚠️ لا يمكن إضافة مهمة فارغة'); return; }
        let newTask = { id: generateId(), text: text, status: 'todo' };
        tasks.unshift(newTask); saveTasks(); refreshAll(); input.value='';
        addGitLog(`✅ تم إضافة: ${text}`);
    };

    // ========== حل مشكلة git add . و الرفع إلى GitHub (محاكاة متقدمة) ==========
    let gitHistory = [];
    function addGitLog(msg){
        let time = new Date().toLocaleTimeString();
        gitHistory.unshift(`[${time}] ${msg}`);
        if(gitHistory.length>6) gitHistory.pop();
        document.getElementById('gitOutput').innerText = gitHistory.join('\n');
    }

    function solveGitProblem() {
        // محاكاة حقيقية لأوامر git add . و git commit و git push
        let repoName = "task-flow-project";
        let totalFiles = tasks.length;
        let modifiedFiles = tasks.map(t=> `  - ${t.text.substring(0,30)}`).join('\n');
        
        let gitSimulation = `
🚀 **حل مشكلة git add . ورفع المشروع إلى GitHub** 🚀

1️⃣ Initializing local repository:
   $ git init
   ✅ Initialized empty Git repository in ./${repoName}

2️⃣ Adding all files (حل المشكلة الأساسي):
   $ git add .
   ✅ Staged ${totalFiles} task files + assets

3️⃣ Creating commit:
   $ git commit -m "Add Task Flow with Dashboard & Board"
   ✅ [main (root-commit)] ${Math.random().toString(36).substr(2,7)}: ${totalFiles} tasks added

4️⃣ Linking to GitHub remote:
   $ git remote add origin https://github.com/your-username/${repoName}.git

5️⃣ Pushing to GitHub (الرفع النهائي):
   $ git push -u origin main
   ✅ Branch 'main' set up to track remote branch 'main'.
   ✅ Successfully pushed! All tasks uploaded.

📦 الملفات المرفوعة:
${modifiedFiles || '  - no tasks yet'}

💡 نصيحة عملية: قم بتنفيذ الأوامر أعلاه في الـ Terminal الخاص بك (Git Bash)
   وستجد مشكلة git add . قد تم حلها بالكامل.
        `;
        document.getElementById('gitOutput').innerText = gitSimulation;
        addGitLog('🎉 تم حل مشكلة git add . وتم الرفع إلى GitHub (محاكاة ناجحة)');
        // حفظ نسخة احتياطية كـ snapshot
        localStorage.setItem('taskflow_git_snapshot', JSON.stringify({backup:tasks, date:new Date()}));
    }

    document.getElementById('gitActionBtn').onclick = solveGitProblem;

    // ========== اللغة ==========
    function setLanguage(lang) {
        currentLang = lang;
        let body = document.body;
        if(lang === 'ar') { body.classList.remove('english'); body.classList.add('arabic'); }
        else { body.classList.remove('arabic'); body.classList.add('english'); }
        document.getElementById('arabicBtn').classList.toggle('active', lang==='ar');
        document.getElementById('englishBtn').classList.toggle('active', lang==='en');
        
        // نصوص واجهة Dashboard
        document.getElementById('totalLabel').innerText = lang==='ar'?'إجمالي المهام':'Total Tasks';
        document.getElementById('todoLabel').innerText = lang==='ar'?'معلقة':'To Do';
        document.getElementById('progressLabel').innerText = lang==='ar'?'قيد التنفيذ':'In Progress';
        document.getElementById('doneLabel').innerText = lang==='ar'?'منجزة':'Done';
        document.getElementById('recentTitle').innerHTML = lang==='ar'?'🕒 آخر المهام':'🕒 Recent Tasks';
        document.getElementById('todoColTitle').innerText = lang==='ar'?'معلق':'To Do';
        document.getElementById('progressColTitle').innerText = lang==='ar'?'قيد التنفيذ':'In Progress';
        document.getElementById('doneColTitle').innerText = lang==='ar'?'مكتمل':'Done';
        document.getElementById('addBtnText').innerText = lang==='ar'?'إضافة':'Add';
        document.getElementById('gitBtnText').innerText = lang==='ar'?'حل مشكلة git add .':'Fix git add .';
        document.getElementById('gitConsoleTitle').innerHTML = lang==='ar'?'Git Terminal | حل add . و push':'Git Terminal | Fix add . & push';
        document.querySelectorAll('.tabTxt').forEach((el,idx)=> el.innerText = (lang==='ar'?(idx===0?'لوحة القيادة':'لوحة المهام'):(idx===0?'Dashboard':'Board')));
        refreshAll();
        addGitLog(`🌐 تم تغيير اللغة إلى ${lang==='ar'?'العربية':'English'}`);
    }

    document.getElementById('arabicBtn').onclick = ()=> setLanguage('ar');
    document.getElementById('englishBtn').onclick = ()=> setLanguage('en');

    // التبديل بين التبويبات
    document.querySelectorAll('.tab-btn').forEach(btn=>{
        btn.onclick = ()=>{
            let tab = btn.dataset.tab;
            document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active-panel'));
            document.getElementById(`${tab}Panel`).classList.add('active-panel');
            document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
            btn.classList.add('active');
            if(tab==='board') refreshBoard();
            else refreshDashboard();
        };
    });

    refreshAll();
    setLanguage('ar');
</script>
</body>
</html>
